#端口号
server.port=8899

#根路径
server.servlet.context-path=/app

#项目名称
spring.application.name=test-service

#es配置
spring.elasticsearch.rest.uris=127.0.0.1:9200
spring.elasticsearch.rest.connectionTimeout=3
spring.elasticsearch.rest.readTimeout=90
spring.elasticsearch.rest.username=
spring.elasticsearch.rest.password=

#线程池
async.executor.thread.core_pool_size=1
async.executor.thread.max_pool_size=2
async.executor.thread.queue_capacity=512

#数据库配置
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://172.18.1.156:3306/uat_partner?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&failOverReadOnly=false
spring.datasource.druid.username=partner
spring.datasource.druid.password=983!SUN@#9020@809

# 初始化⼤⼩、最⼩、最⼤连接数
spring.datasource.druid.initial-size=3
spring.datasource.druid.min-idle=3
spring.datasource.druid.max-active=10

# 配置获取连接等待超时的时间
spring.datasource.druid.max-wait=60000

# 监控后台账号和密码
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=admin
spring.datasource.druid.stat-view-servlet.reset-enable=false

# 配置 StatFilter
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=2000

mybatis.typeAliasesPackage=com.example.testapi.model
mybatis.mapperLocations=classpath*:/mapper/**/**Mapper.xml
mybatis.type-handlers-package=com.example.testservice.typeHandler

# ==================== Redis 配置 ====================
# Redis 服务器地址
spring.redis.host=127.0.0.1
# Redis 服务器端口
spring.redis.port=6379
# Redis 密码（无密码留空）
spring.redis.password=
# Redis 数据库索引（默认 0）
spring.redis.database=0
# 连接超时时间（毫秒）
spring.redis.timeout=3000

# Lettuce 连接池配置
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=3000
spring.redis.lettuce.pool.time-between-eviction-runs=60s

# ==================== JWT 配置 ====================
# JWT 密钥（生产环境请使用强密钥，至少 32 字符）
jwt.secret=partner-jwt-secret-key-256bit!!
# JWT 过期时间（毫秒），默认 24 小时
jwt.expiration=86400000

# ==================== Shiro 配置 ====================
# 启用 Shiro
shiro.enabled=true
shiro.loginUrl=
shiro.successUrl=
shiro.unauthorizedUrl=

# Shiro Session 配置
# Session 超时时间（毫秒），默认 30 分钟
shiro.session.globalSessionTimeout=1800000
# Session 验证调度器间隔（毫秒）
shiro.session.validationInterval=300000
# Cookie 名称
shiro.session.sessionIdCookie.name=sid
# Cookie 路径
shiro.session.sessionIdCookie.path=/
# Cookie HttpOnly
shiro.session.sessionIdCookie.httpOnly=true
# Cookie 有效期（秒），-1 为浏览器关闭失效
shiro.session.sessionIdCookie.maxAge=-1

# Redis 中 Session 的 key 前缀
shiro.redis.session.key-prefix=shiro:session: